{% include "header.html" %}

{% block body %}

<div class="container">
    <div class="panel panel-default">
        <div class="panel-heading">
            <h3>Add Client</h3>
            <h4><a href="/">Back</a></h4>
        </div>
        
        <div class="panel-body">
            <form action="{{ url_for('processstudent') }}" method="post">
                <div class="form-group">
                    <label for="name">Client Name</label>
                    <input type="text" class="form-control" name="name" id="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Client Email</label>
                    <input type="email" class="form-control" name="email" id="email" required>
                </div>
                
                <div class="form-group">
                    <label for="phone">Client Phone</label>
                    <input type="tel" class="form-control" name="phone" id="phone" required>
                </div>
                
                <div class="form-group">
                    <label for="address">Client Address</label>
                    <input type="text" class="form-control" name="address" id="address" required>
                </div>
                
                <div class="form-group">
                    <label for="state">Client State</label>
                    <input type="text" class="form-control" name="state" id="state" required>
                </div>
                
                <div class="form-group">
                    <label for="gst_num">Client GST Number</label>
                    <input type="number" class="form-control" name="gst_num" id="gst_num" required>
                </div>
                
                <div class="form-group">
                    <label for="client_type">Client Type</label>
                    <select type="text" class="form-control" name="client_type" required>
                        <option value="government">Government</option>
                        <option value="private">Private</option>
                        <option value="PSU">PSU</option>
                        <option value="foreign agency">Foreign agency</option>
                        <option value="others">Others</option>
                    </select>
                </div>
                
                <input type="hidden" name="id" value="1">
                <input type="hidden" name="action" value="edit">
                <button type="submit" class="btn btn-success" name="submit">Add Client</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
{% include "footer.html" %}
